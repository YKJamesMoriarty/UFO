base_body: pelvis_link
root_quat_order: xyzw
coordinate_system: z_up
dof_unit: rad

control_joints:
  mode: all_actuated

feet:
  - left_ankle_roll_Link
  - right_ankle_roll_Link

# A3T2.5 has no independent wrist/hand bodies in this MJCF -- the deploy
# URDF importer fixed-joints all 6 wrist links onto the elbow bodies (see
# whole_body_tracking/tasks/tracking/config/a3/flat_env_cfg.py comment).
# Use elbow bodies as the upper-limb tracking endpoints, matching
# beyondmimic's own A3FlatEnvCfg.terminations.ee_body_pos body_names.
hands:
  - left_elbow_Link
  - right_elbow_Link

key_bodies:
  - pelvis_link
  - torso_Link
  - left_ankle_roll_Link
  - right_ankle_roll_Link
  - left_elbow_Link
  - right_elbow_Link

default_dof_pos: {}

